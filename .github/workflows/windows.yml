name: Windows

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y
          choco install mingw -y

      - name: Configure CMake
        run: |
          cd build && cmake -G "MinGW Makefiles" ..

      - name: Build project
        run: |
          cd build
          cmake --build . --

      - name: Verify build artifacts
        run: |
          echo "Listing contents of build/lib/"
          Get-ChildItem -Path build/lib/
          echo "Listing contents of build/bin/"
          Get-ChildItem -Path build/bin/

      - name: Run C11 core tests
        run: |
          ctest --test-dir build --output-on-failure -R "^ccsdspack_c_core$"

      - name: Build and run C11-only core
        shell: pwsh
        run: |
          cmake -S . -B build-c-only -G "MinGW Makefiles" `
            -DCCSDSPACK_BUILD_CPP=OFF `
            -DCCSDSPACK_BUILD_C_TESTS=ON
          cmake --build build-c-only --
          ctest --test-dir build-c-only --output-on-failure

      - name: Run tests
        shell: pwsh
        run: |
          Write-Host "Running CCSDSPack_tester.exe from build\bin\"
          Set-Location build\bin
          .\CCSDSPack_tester.exe 2>&1 | Tee-Object -FilePath CCSDSPack_tester.log
          exit $LASTEXITCODE

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-log-${{ github.sha }}
          path: build/bin/CCSDSPack_tester.log
          if-no-files-found: error

      - name: Run CLI integration tests
        id: cli_integration
        shell: pwsh
        run: |
          python test/cli_integration.py `
            --bin-dir "$PWD/build/bin" `
            --resources "$PWD/test/test_resources" 2>&1 | Tee-Object -FilePath cli_integration.log
          exit $LASTEXITCODE

      - name: Upload CLI integration failure log
        if: failure() && steps.cli_integration.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: windows-cli-log-${{ github.sha }}
          path: cli_integration.log
          if-no-files-found: error

      - name: Install shared library package
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          cmake --install build --prefix $installPrefix

      - name: Configure installed C11 core consumer
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          cmake -S test/package_tester/c_core `
            -B build/package_tester/c_core `
            -G "MinGW Makefiles" `
            "-DCMAKE_PREFIX_PATH=$installPrefix"

      - name: Build and run installed C11 core consumer
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          cmake --build build/package_tester/c_core --
          $env:PATH = "$(Join-Path $installPrefix 'bin');$env:PATH"
          ctest --test-dir build/package_tester/c_core --output-on-failure

      - name: Configure installed shared-library consumer
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          cmake -S test/package_tester/shared_lib `
            -B build/package_tester/shared_lib `
            -G "MinGW Makefiles" `
            "-DCMAKE_PREFIX_PATH=$installPrefix"

      - name: Build installed shared-library consumer
        shell: pwsh
        run: |
          cmake --build build/package_tester/shared_lib --

      - name: Run installed shared-library consumer
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          $env:PATH = "$(Join-Path $installPrefix 'bin');$env:PATH"
          ctest --test-dir build/package_tester/shared_lib --output-on-failure

      - name: Configure installed-package examples
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          cmake -S example `
            -B build/examples/all `
            -G "MinGW Makefiles" `
            "-DCMAKE_PREFIX_PATH=$installPrefix"

      - name: Build and run installed-package examples
        shell: pwsh
        run: |
          $installPrefix = Join-Path $PWD "build/install"
          cmake --build build/examples/all --
          $env:PATH = "$(Join-Path $installPrefix 'bin');$env:PATH"
          ctest --test-dir build/examples/all --output-on-failure
