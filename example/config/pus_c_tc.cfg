# ECSS-E-ST-70-41C PUS telecommand configuration.
# Revision and direction are intrinsic to PUS:revC:TC. PUS-C source ID width is fixed at two octets.
ccsds_packet_error_control:string=crc16
data_field_size:int=32
sync_pattern_enable:bool=false
validation_enable:bool=true
ccsds_version_number:int=0
ccsds_APID:int=42
ccsds_segmented:bool=false
define_secondary_header:bool=true
secondary_header_type:string=PUS:revC:TC
secondary_header_spare_octets:int=0
pus_service_type:uint=17
pus_service_subtype:uint=1
pus_acknowledgement_flags:uint=9
pus_source_id:uint=0x1234
