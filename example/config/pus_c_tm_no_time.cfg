# ECSS-E-ST-70-41C PUS telemetry configuration without a time field.
# Revision, direction, fixed destination-ID width, and no-time default come from PUS:revC:TM.
ccsds_packet_error_control:string=crc16
data_field_size:int=32
sync_pattern_enable:bool=false
validation_enable:bool=true
ccsds_version_number:int=0
ccsds_APID:int=42
ccsds_segmented:bool=false
define_secondary_header:bool=true
secondary_header_type:string=PUS:revC:TM
pus_time_format:string=none
pus_service_type:uint=3
pus_service_subtype:uint=25
pus_message_type_counter:uint=7
pus_time_reference_status:uint=0
pus_destination_id:uint=0x1234
