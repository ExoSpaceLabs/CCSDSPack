# ECSS-E-ST-70-41C PUS telemetry configuration with explicit basic CUC time.
# Revision and direction are intrinsic to PUS:revC:TM. PUS-C destination ID width is fixed at two octets.
ccsds_packet_error_control:string=crc16
data_field_size:int=32
sync_pattern_enable:bool=false
validation_enable:bool=true
ccsds_version_number:int=0
ccsds_APID:int=42
ccsds_segmented:bool=false
define_secondary_header:bool=true
secondary_header_type:string=PUS:revC:TM
secondary_header_spare_octets:int=0
pus_time_format:string=cuc
pus_time_epoch:string=ccsds-1958-tai
pus_time_p_field:string=explicit
pus_time_coarse_octets:int=4
pus_time_fine_octets:int=2
pus_service_type:uint=3
pus_service_subtype:uint=25
pus_message_type_counter:uint=7
pus_time_reference_status:uint=2
pus_destination_id:uint=0x1234
pus_time_coarse:uint=0x01020304
pus_time_fine:uint=0xA0B0
