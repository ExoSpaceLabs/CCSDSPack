# ECSS-E-70-41A PUS telemetry configuration without a time field.
# Revision/direction are intrinsic to PUS:revA:TM. Width and subcounter remain optional PUS-A tailoring.
ccsds_packet_error_control:string=crc16
data_field_size:int=32
sync_pattern_enable:bool=false
validation_enable:bool=true
ccsds_version_number:int=0
ccsds_APID:int=42
ccsds_segmented:bool=false
define_secondary_header:bool=true
secondary_header_type:string=PUS:revA:TM
pus_destination_id_octets:int=1
pus_a_tm_packet_subcounter_present:bool=true
secondary_header_spare_octets:int=0
pus_time_format:string=none
pus_service_type:uint=3
pus_service_subtype:uint=25
pus_packet_subcounter:uint=7
pus_destination_id:uint=0x42
