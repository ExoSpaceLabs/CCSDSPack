# ST-LINK over SWD.
source [find interface/stlink.cfg]
transport select hla_swd

# STM32H755 dual-bank target.
source [find target/stm32h7x_dual_bank.cfg]

# Attach under reset so even a broken validation image remains recoverable.
reset_config srst_only srst_nogate connect_assert_srst

# Conservative first-contact speed. Validation reliability matters more than
# shaving a few seconds off the flash step.
adapter speed 400
